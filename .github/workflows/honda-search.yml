- name: Commit and push results
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes detected, skipping commit"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S EST')
          TRIGGER_SOURCE="${{ github.event.inputs.triggered_by || github.event.client_payload.triggered_by || 'manual' }}"
          git commit -m "🚗 Manual search results - ${TIMESTAMP} - Found ${{ steps.count.outputs.count }} vehicles - Triggered by: ${TRIGGER_SOURCE}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
        fi

